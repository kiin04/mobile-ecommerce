stages:
  - build
  - deploy

include:
  - local: '/WebAPI/WebAPI/.be-ci.yml'
  - local: '/admin/.admin-ci.yml'
  - local: '/user/.user-ci.yml'

deploy_to_server:
  stage: deploy
  tags:
    - deploy-server
  needs: 
    - job: build_backend
      optional: true 
    - job: build_frontend_admin
      optional: true
    - job: build_frontend_user
      optional: true
  before_script:
    - sudo apt-get update -y && sudo apt-get install -y openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
  script:
    - ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "
        cd /home/project && 
        docker compose pull && 
        docker compose up -d &&
        docker image prune -f"