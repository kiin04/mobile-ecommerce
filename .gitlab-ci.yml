stages:
  - build
  - deploy

.docker_login: &docker_login
  before_script:
    - echo "$DOCKERHUB_PASS" | docker login -u "$DOCKERHUB_USER" --password-stdin

build_backend:
  <<: *docker_login
  stage: build
  tags:
    - build
  image: docker:latest
  script:
    - docker build --network host -t $DOCKERHUB_USER/shop-be:latest -f ./WebAPI/WebAPI/Dockerfile .
    - docker push $DOCKERHUB_USER/shop-be:latest
  rules:
    - changes:
        - WebAPI/**/*

build_frontend_admin:
  <<: *docker_login
  stage: build
  tags:
    - build
  image: docker:latest
  script:
    - docker build --network host -t $DOCKERHUB_USER/shop-admin:latest -f ./admin/Dockerfile .
    - docker push $DOCKERHUB_USER/shop-admin:latest
  rules:
    - changes:
        - admin/**/*

build_frontend_user:
  <<: *docker_login
  stage: build
  tags:
    - build
  image: docker:latest
  script:
    - docker build --network host -t $DOCKERHUB_USER/shop-user:latest -f ./user/Dockerfile .
    - docker push $DOCKERHUB_USER/shop-user:latest
  rules:
    - changes:
        - user/**/*

deploy_to_server:
  stage: deploy
  tags:
    - deploy-server
  image: alpine:latest
  needs: 
    - job: build_backend
      optional: true 
    - job: build_frontend_admin
      optional: true
    - job: build_frontend_user
      optional: true
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
  script:
    - ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "
        cd /home/project && 
        docker compose pull && 
        docker compose up -d &&
        docker image prune -f"